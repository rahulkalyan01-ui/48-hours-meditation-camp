<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>48 Hours Meditation Camp — 4th Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F6EAE1;--light:#FBF3EB;--blush:#F4DFD4;--pink:#EACDC3;--mauve:#D7B9B2;--rose:#C6A39F;--maroon:#784E4D;--rose2:#8F6867;--text:#5D3A38;--glass:rgba(251,243,235,.62);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:linear-gradient(var(--light),var(--ivory) 40%,var(--blush));color:var(--text);font:16px/1.6 var(--sans);overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.1}
.wrap{max-width:1040px;margin:0 auto;padding:64px 20px}
.glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.65);box-shadow:0 15px 45px rgba(120,78,77,.08);border-radius:30px}
nav{position:fixed;top:0;left:0;right:0;z-index:20;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
nav .glass{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-radius:20px}
nav a{color:var(--text);text-decoration:none;font-size:13px;letter-spacing:.12em;font-weight:500}
#links{display:none;gap:22px}
#menu{background:none;border:0;font-size:24px;color:var(--maroon);min-height:44px;min-width:44px}
#links.open{display:flex;flex-direction:column;position:absolute;top:64px;left:14px;right:14px;padding:20px;background:var(--light);border-radius:20px;gap:18px}
@media(min-width:800px){#links{display:flex}#menu{display:none}}
.hero{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:90px 20px 50px;background:linear-gradient(#FBF3EB,#F4DFD4 45%,#EACDC3);overflow:hidden}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:62%;animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(-14px) scale(1.03)}}
.sun{position:absolute;bottom:34%;left:50%;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:radial-gradient(#fff3,#F4DFD4aa 60%,transparent 70%)}
.hero .in{position:relative;z-index:2;max-width:720px;padding:28px 20px;background:rgba(251,243,235,.38);backdrop-filter:blur(6px);border-radius:36px}
.logo{width:96px;height:96px;display:block;margin:0 auto 14px}
.sm{letter-spacing:.2em;font-size:12px;font-weight:600;text-transform:uppercase}
.big{font-size:clamp(58px,17vw,112px);font-weight:700;color:var(--maroon);letter-spacing:-.01em}
.med{font-size:clamp(28px,8vw,48px);letter-spacing:.14em;font-weight:600}
.tag{letter-spacing:.14em;font-size:13px;text-transform:uppercase;margin:18px 0}
.date{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--maroon)}
.chip{display:inline-block;margin:14px 0 20px;padding:9px 18px;border-radius:999px;background:var(--pink);border:1px solid var(--mauve);font-size:13px;font-weight:600;letter-spacing:.08em}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:18px;border:1px solid var(--maroon);background:var(--maroon);color:var(--light);font:600 14px var(--sans);letter-spacing:.1em;text-decoration:none;cursor:pointer;transition:.3s;margin:4px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(120,78,77,.2);background:var(--rose2)}
.btn.ghost{background:transparent;color:var(--maroon)}
